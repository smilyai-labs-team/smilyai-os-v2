[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smilyai-os"
version = "0.3.1"
description = "AI-native Linux desktop shell and least-privilege system harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SmilyAI"}]
dependencies = []

[project.scripts]
smilyai = "smilyai.cli:main"
smilyai-harness = "smilyai.server:main"

[tool.setuptools.packages.find]
include = ["smilyai*", "shell"]

[tool.setuptools.package-data]
shell = ["*.html", "*.css", "*.js", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
